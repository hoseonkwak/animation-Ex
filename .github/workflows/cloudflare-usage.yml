name: Cloudflare usage sync

on:
  workflow_dispatch:
    inputs:
      usage_date:
        description: UTC date to synchronize (YYYY-MM-DD, defaults to today)
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate usage fixtures and ingestion contract
        run: npm run test --workspace @kwak-motion/lab -- tests/operations tests/ingestion/api.spec.ts
      - name: Query Cloudflare Analytics and store snapshot
        env:
          USAGE_DATE: ${{ inputs.usage_date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_WORKER_SCRIPT_NAME: ${{ secrets.CLOUDFLARE_WORKER_SCRIPT_NAME }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          INGESTION_API_URL: ${{ secrets.INGESTION_API_URL }}
          INGESTION_KEY_ID: ${{ secrets.INGESTION_KEY_ID }}
          INGESTION_HMAC_SECRET: ${{ secrets.INGESTION_HMAC_SECRET }}
        run: npm run sync:cloudflare-usage
