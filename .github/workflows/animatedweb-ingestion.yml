name: The Animated Web ingestion

concurrency:
  group: animatedweb-ingestion
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

jobs:
  ingest:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate ingestion fixtures
        run: npm run test:ingestion
      - name: Collect curated CodePen candidates
        working-directory: apps/lab
        env:
          INGESTION_API_URL: ${{ secrets.INGESTION_API_URL }}
          INGESTION_KEY_ID: ${{ secrets.INGESTION_KEY_ID }}
          INGESTION_HMAC_SECRET: ${{ secrets.INGESTION_HMAC_SECRET }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            set -- --scheduled
          else
            set --
          fi
          node --experimental-transform-types ingestion/animatedweb-cli.ts --live --remote-checkpoint "$@"
